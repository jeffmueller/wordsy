# Container-side config: plain HTTP on port 80, no host-specific paths.
# TLS, real hostnames and certificates belong to whatever reverse proxy
# (Caddy, Traefik, NPM, the NAS's own front end) sits in front of this.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers. Defined only here: adding an add_header inside a
    # location would drop every one of these from that location's responses.
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # words.js alone is ~110 KB of word list, so compression is worth having.
    # Both JavaScript MIME types are listed because nginx's default for .js
    # changed from application/javascript to text/javascript across versions.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_types        text/css text/javascript application/javascript image/svg+xml;

    # Asset filenames are not content-hashed, so they cannot be cached
    # immutably: pulling a newer image has to actually reach browsers that
    # already loaded the old files. An hour of max-age, then a cheap
    # ETag revalidation. (`expires` is used rather than `add_header` so the
    # security headers above stay inherited.)
    location ~* \.(css|js|svg|ico)$ {
        expires 1h;
    }

    location / {
        expires -1;                      # index.html: revalidate every load
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
